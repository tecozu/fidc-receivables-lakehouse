version: 2

seeds:
  - name: funds
    description: Fund registry and the loss-provision policy each fund follows.
    columns:
      - name: fund_code
        data_tests: [unique, not_null]
      - name: provision_policy_id
        data_tests: [not_null]

  - name: provision_buckets
    description: >
      Loss-provision policy (inspired by Brazilian Central Bank Resolution 2682):
      % of present value to provision by days overdue. Versioned with
      valid_from/valid_to so past dates are always valued with the policy in force then.
    columns:
      - name: provision_rate
        data_tests:
          - expression_is_true:
              arguments:
                expression: "provision_rate between 0 and 1"

  - name: b3_holidays
    description: B3 trading holidays, generated by `fidc holidays` (Easter-based rules).
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]
