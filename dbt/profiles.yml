fidc_lakehouse:
  target: "{{ env_var('FIDC_DBT_TARGET', 'dev') }}"
  outputs:
    # Local development and CI: a single DuckDB file.
    dev:
      type: duckdb
      path: "{{ env_var('FIDC_DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4

    # Production: a Databricks SQL warehouse over Delta tables in Unity Catalog.
    # Everything comes from the environment; the token never lives in the repository.
    prod:
      type: databricks
      catalog: "{{ env_var('FIDC_DATABRICKS_CATALOG', 'workspace') }}"
      schema: fidc
      host: "{{ env_var('DATABRICKS_HOST', 'placeholder.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/placeholder') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN', 'placeholder') }}"
      threads: 2
