fidc_lakehouse:
  target: "{{ env_var('FIDC_DBT_TARGET', 'dev') }}"
  outputs:
    # Local development and CI: a single DuckDB file.
    dev:
      type: duckdb
      path: "{{ env_var('FIDC_DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4

    # Production: Amazon Athena over the S3 lake, tables registered in the Glue catalog.
    # No credentials here: boto3 picks them up from the environment (an SSO profile
    # locally, the ECS task role in AWS).
    prod:
      type: athena
      database: awsdatacatalog
      schema: fidc
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      work_group: "{{ env_var('FIDC_ATHENA_WORKGROUP', 'fidc') }}"
      s3_staging_dir: "{{ env_var('FIDC_ATHENA_RESULTS_URI', 's3://placeholder-athena-results/') }}"
      s3_data_dir: "{{ env_var('FIDC_LAKE_URI', 's3://placeholder-lake/') }}"
      s3_data_naming: schema_table_unique
      threads: 4
