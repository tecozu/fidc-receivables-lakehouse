version: 2

# Locally these are DuckDB schemas written by `fidc ingest`. On Databricks they are
# Delta tables in Unity Catalog, written by the Lakeflow pipeline. Both come from the
# same Spark functions (src/fidc_lakehouse/spark_pipeline.py).
sources:
  - name: silver
    schema: "{{ 'fidc_silver' if target.type == 'databricks' else 'silver' }}"
    description: Rows accepted by the ingestion quality gate (typed, with lineage).
    tables:
      - name: acquisitions
        description: Receivables purchased by each fund.
      - name: settlements
        description: Payments and cancellations received for those receivables.

  - name: meta
    schema: "{{ 'fidc_meta' if target.type == 'databricks' else 'meta' }}"
    description: Ingestion control tables written by the ingestion.
    tables:
      - name: file_ledger
        description: One row per ingested file version (SHA-256 fingerprint).
      - name: rejected_rows
        description: Rows rejected at ingestion, with the reason and original payload.
