version: 2

# These are the DuckDB tables written by `fidc ingest`. On Databricks the pipeline writes
# one table per fund instead, and models reach them through the `silver_table` macro
# (macros/silver.sql). Both come from the same Spark functions
# (src/fidc_lakehouse/spark_pipeline.py).
sources:
  - name: silver
    schema: silver
    description: Rows accepted by the ingestion quality gate (typed, with lineage).
    tables:
      - name: acquisitions
        description: Receivables purchased by each fund.
      - name: settlements
        description: Payments and cancellations received for those receivables.

  - name: meta
    schema: meta
    description: Ingestion control tables written by the ingestion.
    tables:
      - name: file_ledger
        description: One row per ingested file version (SHA-256 fingerprint).
      - name: rejected_rows
        description: Rows rejected at ingestion, with the reason and original payload.
