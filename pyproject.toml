[project]
name = "fidc-lakehouse"
version = "0.1.0"
description = "Daily valuation pipeline for a Brazilian receivables fund (FIDC): idempotent file ingestion, DuckDB, dbt and data contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renato Araujo" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "faker>=30.0",
    "dbt-core>=1.10,<2.0",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fidc = "fidc_lakehouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidc_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
