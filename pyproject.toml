[project]
name = "fidc-lakehouse"
version = "0.1.0"
description = "Daily valuation lakehouse for a Brazilian receivables fund (FIDC) on Databricks: Auto Loader, Lakeflow, dbt and Unity Catalog, with DuckDB for local runs and CI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renato Araujo" }]
# Only what the Databricks pipeline needs at runtime, because it installs this wheel.
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
local = [
    "duckdb>=1.1",
    "faker>=30.0",
    "dbt-core>=1.10,<2.0",
    "dbt-duckdb>=1.9",
]
databricks = ["dbt-databricks>=1.10"]
dev = ["fidc-lakehouse[local]", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fidc = "fidc_lakehouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidc_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
