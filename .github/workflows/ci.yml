name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: End-to-end pipeline (generate -> ingest -> dbt build + tests, 2 months)
        run: |
          fidc generate --start 2026-01-02 --end 2026-02-27
          fidc backfill --start 2026-01-02 --end 2026-02-27

      - name: Idempotency check (re-running a date loads nothing new and still passes)
        run: fidc run --as-of 2026-02-27

      - name: Athena dialect check (compile for prod against a mocked AWS, parse as Trino)
        env:
          FIDC_DBT_TARGET: prod
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:5055
        run: |
          uv pip install --system -e ".[aws]" "moto[server]" sqlglot
          moto_server -p 5055 &
          sleep 3
          rm -rf dbt/target
          dbt compile --no-introspect --project-dir dbt --profiles-dir dbt --vars '{as_of_date: "2026-02-27"}'
          python scripts/check_athena_sql.py
