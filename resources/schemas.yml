resources:
  schemas:
    landing_schema:
      catalog_name: ${var.catalog}
      name: fidc_landing
      comment: Where the administrators' files arrive.
    silver_schema:
      catalog_name: ${var.catalog}
      name: fidc_silver
      comment: Rows that passed the quality gate, typed.
    meta_schema:
      catalog_name: ${var.catalog}
      name: fidc_meta
      comment: Rejected rows and the file ledger.
    bronze_schema:
      catalog_name: ${var.catalog}
      name: fidc_bronze
      comment: Every row of every file exactly as it arrived (text), plus file fingerprints.

  volumes:
    landing_volume:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing_schema.name}
      name: landing
      comment: "<FUND>/<event>/<event>_<YYYY-MM-DD>.csv"
    archive_volume:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing_schema.name}
      name: archive
      comment: Simulation only. The administrator's outbox; deliver_files copies from here to landing.
